[package]
name = "libid-server-rs"
version = "0.2.2"
edition = "2021"
# Inherited from libid-rs: TLSNotary alpha.15's MPZ graph requires Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libid-server-rs"
description = "libID server: OAuth handle-claim flow producing bind-ready MPC-TLS proofs. The UI submits the bind on-chain itself."
publish = false

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────
# All four pinned to the same release tag of the git repo. Three of them are
# also on crates.io, but libid-tlsn is git-only (its upstream `tlsn` dep is
# not on crates.io) and its API exposes libid-transcript types — mixing the
# registry copies with the git copy puts two incompatible versions of the
# same types in the graph. One source, one tag, until libid-tlsn can be
# published.
#
# libid-signer is deliberately absent, and with it the AWS SDK: this service
# holds no signing key. Nothing else here needs it — the notary digest is
# only ever verified, never signed.
# Pinned to a REVISION, not a tag, and deliberately: the ceremony
# constructions this service needs live on libid-rs#2 and are not in any
# release yet. The revision carries the merged alpha.15 upgrade as well, so
# this is the release graph plus that one branch. Move to the tag the day
# libid-rs cuts one containing `libid-ceremony`.
libid-ceremony = { git = "https://github.com/libid-org/libid-rs", rev = "cafd9a0b3b3c1c4a2e735a279e5904e4d0e19471" }
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", rev = "cafd9a0b3b3c1c4a2e735a279e5904e4d0e19471" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", rev = "cafd9a0b3b3c1c4a2e735a279e5904e4d0e19471" }
# Upstream TLSNotary is NOT a direct dependency. Everything this service reads
# off a session — `CommitmentOpening` and the `Direction` it carries — comes
# re-exported from libid-tlsn, which pins tlsn itself. One pin, so the graph
# cannot hold two incompatible copies of the same types.

# ── HTTP server / client ────────────────────────────────────────────────
axum = "0.8"

# ── everything else ─────────────────────────────────────────────────────
base64 = "0.22"
# The notarized request is built as a `hyper::Request`, which is what
# `prover_generic` takes: the session drives the exchange itself rather than
# handing it to an HTTP client.
bytes = "1"
http-body-util = "0.1"
hyper = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
