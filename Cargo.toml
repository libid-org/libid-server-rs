[package]
name = "libid-server-rs"
version = "0.2.2"
edition = "2021"
# Inherited from libid-rs: TLSNotary alpha.15's MPZ graph requires Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libid-server-rs"
description = "libID OAuth Bridge: publishes the ceremony configuration, serves the callback shell, and performs GitHub's confidential token exchange inside an MPC-TLS session."
publish = false

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────
# Three crates, one source, one revision. Two of them are also on crates.io,
# but libid-tlsn is git-only (its upstream `tlsn` dep is not on crates.io) and
# its API exposes libid-transcript types — mixing the registry copies with the
# git copy puts two incompatible versions of the same types in the graph. One
# source until libid-tlsn can be published.
#
# libid-signer is deliberately absent, and with it the AWS SDK: this service
# holds no signing key. Nothing else here needs it — the notary digest is
# only ever verified, never signed.
# Pinned to a REVISION, not a tag, and deliberately: the ceremony
# constructions this service needs are not in any release yet. Move to the tag
# the day libid-rs cuts one containing `libid-ceremony`.
#
# This is libid-rs `main`, at the merge of #2. It is what makes the ceremony
# complete: before it, the verifier read a finished mux driver as a dead
# connection at every stage, so the prover's own `handle.close()` aborted every
# successful session before the attestation was signed. `8954d84` is that fix,
# and `origin_form` beside it is the request-target one -- hyper writes an
# absolute-form request line, which is reserved for a proxy, and the Platform
# Verifier compares the revealed path against a profile constant.
#
# TLSNotary also gates a session on a protocol version, so a prover built
# against alpha.15 cannot talk to a verifier built against alpha.16-pre at all
# -- it fails at "Setting up MPC-TLS" with `prover version does not match with
# verifier`, before any ceremony logic runs. libid-rs pins upstream tlsn at the
# alpha.15 tag; the `[patch]` block at the end of this file redirects it onto
# the fork the NOTARY runs, and that is what makes the two speak. When the
# notary moves, that block moves with it -- this pin does not.
libid-ceremony = { git = "https://github.com/libid-org/libid-rs", rev = "501f094bf10f776c2227ef345908f507a0c80fd0" }
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", rev = "501f094bf10f776c2227ef345908f507a0c80fd0" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", rev = "501f094bf10f776c2227ef345908f507a0c80fd0" }
# Upstream TLSNotary is NOT a direct dependency. Everything this service reads
# off a session — `CommitmentOpening` and the `Direction` it carries — comes
# re-exported from libid-tlsn. What libid-tlsn pins is then overridden by the
# `[patch]` at the end of this file, so the effective tlsn is the fork's and
# there is still exactly one copy in the graph.

# ── HTTP server / client ────────────────────────────────────────────────
axum = "0.8"
# One layer, one origin: the token-route preflight OAUTH_BRIDGE.md requires
# answered, for the configured CCDP origin.
tower-http = { version = "0.6", features = ["cors"] }

# ── everything else ─────────────────────────────────────────────────────
base64 = "0.22"
# The callback shell hashes its own bootstrap into its CSP at startup.
sha2 = "0.10"
# `prover_generic` takes a `hyper::Request`; the artifact retrieval is a
# `client`/`http1` connection of this crate's own.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
# `TokioIo`: a tokio socket as hyper's transport.
hyper-util = { version = "0.1", features = ["tokio"] }

# ── artifact retrieval over TLS ─────────────────────────────────────────
# The artifact retrieval's TLS. `ring` is the one crypto provider in the
# graph (`cargo tree -i aws-lc-rs` is empty), so `ClientConfig::builder()`
# has exactly one to pick; rustls is reached as `tokio_rustls::rustls`.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
# The trust anchors of the artifact retrieval: the crate libid-tlsn builds
# its own root store from.
webpki-root-certs = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Paused time, for the tests that wait out a budget.
tokio = { version = "1", features = ["test-util"] }
# A fixture Distribution answering with a chunked body.
futures-util = "0.3"
# A self-signed certificate for a fixture Distribution that speaks TLS.
rcgen = "0.13"

# ── TLSNotary fork ──────────────────────────────────────────────────────
# Copied VERBATIM from the notary's Cargo.toml, and it has to stay that way:
# tlsn refuses a session whose peer reports a different protocol version, so
# the prover here and the verifier there must resolve to the same tlsn. When
# the notary moves, this moves with it in the same change.
[patch."https://github.com/tlsnotary/tlsn"]
# WIP: TLSNotary #1178 reclaims the channel, #1179 preserves hash-opening
# order, and #1173 fixes RCOT preprocessing deadlocks. Return to a release
# containing all three fixes when available.
tlsn = { git = "https://github.com/libid-org/tlsn", rev = "8a5de746f73bbe3476a3b10ce411fde3c87e479d" }

# TLSNotary #1173 also needs privacy-ethereum/mpz#446 KOS instance-domain
# separation. Cargo ignores dependency-workspace patches, so repeat TLSN's
# matching alpha.6-compatible pin here for the server and test clients.
[patch."https://github.com/privacy-ethereum/mpz"]
clmul = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
matrix-transpose = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-circuits = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-circuits-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-circuits-data = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-cointoss = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-cointoss-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-common = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-fields = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-garble = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-garble-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-hash = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-ideal-vm = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-memory-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-ole = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-ole-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-ot = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-ot-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-share-conversion = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-share-conversion-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-vm-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-zk = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }
mpz-zk-core = { git = "https://github.com/libid-org/mpz", rev = "c0379ef" }

