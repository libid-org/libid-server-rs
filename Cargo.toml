[package]
name = "libid-server-rs"
version = "0.3.0"
edition = "2021"
# Inherited from libid-rs: TLSNotary alpha.15's MPZ graph requires Rust 1.95.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/libid-org/libid-server-rs"
description = "libID server: OAuth handle-claim flow producing bind-ready MPC-TLS proofs. The UI submits the bind on-chain itself."
publish = false

[dependencies]
# ── libid-rs shared crates ──────────────────────────────────────────────
# All four pinned to the same release tag of the git repo. Three of them are
# also on crates.io, but libid-tlsn is git-only (its upstream `tlsn` dep is
# not on crates.io) and its API exposes libid-transcript types — mixing the
# registry copies with the git copy puts two incompatible versions of the
# same types in the graph. One source, one tag, until libid-tlsn can be
# published.
#
# libid-signer is deliberately absent, and with it the AWS SDK: this service
# holds no signing key. Nothing else here needs it — the notary digest is
# only ever verified, never signed.
libid-attestations = { git = "https://github.com/libid-org/libid-rs", rev = "ad508b2ff5ffeacdfcbf3f4ae1876a43c379a6db" }
libid-crypto = { git = "https://github.com/libid-org/libid-rs", rev = "ad508b2ff5ffeacdfcbf3f4ae1876a43c379a6db" }
libid-tlsn = { git = "https://github.com/libid-org/libid-rs", rev = "ad508b2ff5ffeacdfcbf3f4ae1876a43c379a6db" }
libid-transcript = { git = "https://github.com/libid-org/libid-rs", rev = "ad508b2ff5ffeacdfcbf3f4ae1876a43c379a6db" }
# Upstream TLSNotary, the same pin libid-rs uses. Needed directly for the
# attestation/presentation types (`Attestation`, `CryptoProvider`, `Secrets`).
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }

# ── proof ABI types ─────────────────────────────────────────────────────
alloy-primitives = { version = "1", features = ["serde"] }
alloy-sol-types = "1"

# ── HTTP server / client ────────────────────────────────────────────────
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tower-http = { version = "0.6", features = ["cors"] }

# ── everything else ─────────────────────────────────────────────────────
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
